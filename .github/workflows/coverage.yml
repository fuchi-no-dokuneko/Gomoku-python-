name: Coverage and SonarQube

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt
      - name: Run tests with coverage
        env:
          COVER_REAL_SUBPROCESSES: "1"
        run: |
          python -m coverage run --parallel-mode -m pytest -q --junitxml=test-results.xml
          python -m coverage combine
          python -m coverage report --fail-under=95 > coverage.txt
          cat coverage.txt
          python -m coverage xml -o coverage.xml
          python -m coverage json -o coverage.json
          python -m coverage html -d htmlcov
      - name: Verify SonarQube reports
        run: |
          test -s coverage.xml
          test -s coverage.json
          test -s coverage.txt
          test -s htmlcov/index.html
          test -s test-results.xml
      - name: Verify immutable workflow policy
        run: python tools/check_ci_policy.py
      - name: Require SonarQube Cloud token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing SONAR_TOKEN repository secret; coverage cannot be published."
            exit 1
          fi
      - name: Run SonarQube Cloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_attempt }}
          path: |
            coverage.xml
            coverage.json
            coverage.txt
            htmlcov/index.html
            test-results.xml
          if-no-files-found: error
