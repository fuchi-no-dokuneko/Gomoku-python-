name: Daily Gherkin UAT

on:
  push:
    branches: ["tickets/**"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  real-cli-uat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-uat.txt
      - name: Install product dependency
        run: python -m pip install --requirement requirements-uat.txt
      - name: Prove every Gherkin step is bound
        run: python uat/run_daily_uat.py --dry-run
      - name: Run real command-line acceptance
        run: python uat/run_daily_uat.py --output uat-results
      - name: Import acceptance result into SonarQube Cloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: -Dsonar.testExecutionReportPaths=uat-results/sonar-test-execution.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Upload UAT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-uat-${{ github.run_attempt }}
          path: uat-results
          if-no-files-found: error
